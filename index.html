<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f2930">
<title>ステラペットマルシェ ARフォトスポット</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif
}
button{border:0;font:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  overflow:hidden;background:#000
}
#camera{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background:#000;z-index:1
}
#frameCanvas{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:2;pointer-events:none;background:transparent
}
#controls{
  position:absolute;left:0;right:0;
  bottom:max(18px,env(safe-area-inset-bottom));
  z-index:5;display:flex;justify-content:center;gap:12px;padding:0 14px
}
#controls[hidden]{display:none}
.controlBtn{
  min-width:120px;min-height:50px;padding:12px 18px;
  border-radius:999px;font-size:15px;font-weight:800;
  box-shadow:0 5px 18px rgba(0,0,0,.38)
}
#switchBtn{background:#7b4bb5;color:#fff}
#shootBtn{background:#fff;color:#222}
.screen{
  position:absolute;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));
  color:#fff;text-align:center;
  background:linear-gradient(160deg,#3d3740,#1d1920 82%)
}
.card{
  width:min(100%,430px);padding:28px 20px;border-radius:24px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 18px 60px rgba(0,0,0,.35)
}
.title1,.title2{display:block;white-space:nowrap;font-weight:900;line-height:1.2}
.title1{font-size:clamp(22px,5.7vw,31px)}
.title2{margin-top:6px;font-size:clamp(25px,6.4vw,34px);color:#d98cff}
.card p{margin:18px 0 22px;font-size:15px;line-height:1.75}
#startBtn,#retryBtn,#openBrowserBtn{
  width:100%;min-height:54px;padding:14px 20px;
  border-radius:999px;font-weight:800
}
#startBtn{background:#8c4bc2;color:#fff;font-size:17px}
#retryBtn{margin-top:12px;background:#fff;color:#24142d}
#openBrowserBtn{margin-top:12px;background:#ffd43b;color:#2a1d00;display:none}
#permissionGuide{
  display:none;margin-top:18px;padding:15px;border-radius:16px;
  background:rgba(0,0,0,.28);text-align:left;font-size:13px;line-height:1.7
}
#preview{
  z-index:30;display:none;flex-direction:column;background:rgba(0,0,0,.96)
}
#previewImg{
  max-width:100%;max-height:calc(100dvh - 150px);
  object-fit:contain;border-radius:12px
}
#previewBtns{
  width:min(100%,430px);display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-top:14px
}
#saveBtn,#retakeBtn{
  min-height:50px;padding:12px 14px;border-radius:999px;
  font-size:15px;font-weight:800
}
#saveBtn{background:#ffd43b;color:#21170a}
#retakeBtn{background:#fff;color:#222}
#toast{
  position:fixed;left:50%;top:50%;z-index:60;
  transform:translate(-50%,-45%);
  width:min(calc(100% - 34px),360px);
  padding:18px 20px;border-radius:20px;
  background:rgba(15,15,18,.97);color:#fff;
  opacity:0;visibility:hidden;transition:.22s
}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
#message{
  position:absolute;top:max(10px,env(safe-area-inset-top));
  left:50%;transform:translateX(-50%);
  z-index:7;padding:8px 13px;border-radius:999px;
  color:#fff;background:rgba(0,0,0,.62);
  font-size:13px;opacity:0;transition:.25s
}
#message.show{opacity:1}
canvas.hidden{display:none}
</style>
</head>
<body>
<main id="app">

<div id="stage">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="frameCanvas"></canvas>
</div>

<div id="message"></div>

<div id="controls" hidden>
  <button id="switchBtn" class="controlBtn" type="button">↻ カメラ切替</button>
  <button id="shootBtn" class="controlBtn" type="button">📷 撮影</button>
</div>

<section id="startScreen" class="screen">
  <div class="card">
    <span class="title1">ステラペットマルシェ</span>
    <span class="title2">ARフォトスポット</span>
    <p id="introText">
      カメラを準備しています…<br>
      許可画面が表示されたら<strong>「許可」</strong>してください。
    </p>

    <button id="startBtn" type="button">カメラを起動する</button>
    <button id="retryBtn" type="button" hidden>もう一度カメラを起動する</button>
    <button id="openBrowserBtn" type="button">Safari / Chromeで開く</button>

    <div id="permissionGuide"></div>
  </div>
</section>

<section id="preview" class="screen">
  <img id="previewImg" alt="撮影した写真">
  <div id="previewBtns">
    <button id="saveBtn" type="button">写真を保存</button>
    <button id="retakeBtn" type="button">撮り直す</button>
  </div>
</section>

<div id="toast">✓ 保存しました！</div>
<canvas id="photoCanvas" class="hidden"></canvas>

</main>

<script>
"use strict";

const FRAME_URL = "frame.png?v=68965-direct-v2";

const stage = document.getElementById("stage");
const camera = document.getElementById("camera");
const frameCanvas = document.getElementById("frameCanvas");
const controls = document.getElementById("controls");
const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");
const retryBtn = document.getElementById("retryBtn");
const openBrowserBtn = document.getElementById("openBrowserBtn");
const permissionGuide = document.getElementById("permissionGuide");
const switchBtn = document.getElementById("switchBtn");
const shootBtn = document.getElementById("shootBtn");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const saveBtn = document.getElementById("saveBtn");
const retakeBtn = document.getElementById("retakeBtn");
const photoCanvas = document.getElementById("photoCanvas");
const toast = document.getElementById("toast");
const message = document.getElementById("message");
const introText = document.getElementById("introText");

let stream = null;
let cameraDevices = [];
let currentDeviceId = null;
let frameW = 0;
let frameH = 0;
let frameReady = false;
let capturedBlob = null;
let capturedUrl = "";
let autoTried = false;

function note(text, ms=2200){
  message.textContent = text;
  message.classList.add("show");
  clearTimeout(note.timer);
  note.timer = setTimeout(()=>message.classList.remove("show"),ms);
}

function fitStage(){
  if(!frameW || !frameH){
    stage.style.width = "100vw";
    stage.style.height = "100dvh";
    return;
  }

  const frameRatio = frameW/frameH;
  const vw = innerWidth;
  const vh = innerHeight;
  const viewRatio = vw/vh;

  let w,h;
  if(viewRatio > frameRatio){
    h = vh;
    w = h * frameRatio;
  }else{
    w = vw;
    h = w / frameRatio;
  }

  stage.style.width = w + "px";
  stage.style.height = h + "px";
}
addEventListener("resize",fitStage);

function stopCamera(){
  if(!stream) return;
  stream.getTracks().forEach(t=>t.stop());
  stream = null;
  camera.srcObject = null;
}

function isInAppBrowser(){
  const ua = navigator.userAgent || "";
  return /Instagram|FBAN|FBAV|Line\/|Twitter|X\/|TikTok|GSA/i.test(ua);
}

function showPermissionHelp(){
  permissionGuide.style.display = "block";
  permissionGuide.innerHTML = `
    <strong>カメラを起動できませんでした。</strong><br><br>

    <strong>iPhone / Safari</strong><br>
    アドレス欄の「ぁあ」→「Webサイトの設定」→
    「カメラ」→「許可」<br><br>

    <strong>Android / Chrome</strong><br>
    アドレス欄左の設定アイコン→「権限」→
    「カメラ」→「許可」<br><br>

    設定変更後、「もう一度カメラを起動する」を押してください。
  `;
  startBtn.hidden = true;
  retryBtn.hidden = false;
}

async function prepareFrame(){
  if(frameReady) return;

  const img = new Image();
  img.src = FRAME_URL;

  await new Promise((resolve,reject)=>{
    img.onload = resolve;
    img.onerror = reject;
  });

  frameW = img.naturalWidth;
  frameH = img.naturalHeight;

  frameCanvas.width = frameW;
  frameCanvas.height = frameH;

  const ctx = frameCanvas.getContext("2d",{willReadFrequently:true});
  ctx.clearRect(0,0,frameW,frameH);
  ctx.drawImage(img,0,0);

  const image = ctx.getImageData(0,0,frameW,frameH);
  const data = image.data;

  const total = frameW * frameH;
  const visited = new Uint8Array(total);
  const queue = new Int32Array(total);

  let head = 0;
  let tail = 0;

  const seedX = Math.floor(frameW * 0.50);
  const seedY = Math.floor(frameH * 0.52);
  const seed = seedY * frameW + seedX;

  queue[tail++] = seed;
  visited[seed] = 1;

  function isBlackWindow(index){
    const p = index * 4;
    return data[p] < 35 && data[p+1] < 35 && data[p+2] < 35;
  }

  while(head < tail){
    const i = queue[head++];

    if(!isBlackWindow(i)) continue;

    data[i*4+3] = 0;

    const x = i % frameW;
    const y = (i / frameW) | 0;

    if(x > 0){
      const n=i-1;
      if(!visited[n]){visited[n]=1;queue[tail++]=n;}
    }
    if(x < frameW-1){
      const n=i+1;
      if(!visited[n]){visited[n]=1;queue[tail++]=n;}
    }
    if(y > 0){
      const n=i-frameW;
      if(!visited[n]){visited[n]=1;queue[tail++]=n;}
    }
    if(y < frameH-1){
      const n=i+frameW;
      if(!visited[n]){visited[n]=1;queue[tail++]=n;}
    }
  }

  ctx.putImageData(image,0,0);
  frameReady = true;
  fitStage();
}

async function startCamera(showHelpOnFail=true){
  permissionGuide.style.display = "none";
  startBtn.disabled = true;
  retryBtn.disabled = true;

  try{
    if(!window.isSecureContext){
      throw new Error("HTTPS_REQUIRED");
    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("NO_CAMERA_API");
    }

    stopCamera();

    stream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:false
    });

    camera.srcObject = stream;
    await camera.play();

    const track = stream.getVideoTracks()[0];
    currentDeviceId = track.getSettings().deviceId || null;

    try{
      const devices = await navigator.mediaDevices.enumerateDevices();
      cameraDevices = devices.filter(d=>d.kind==="videoinput");
    }catch(e){}

    startScreen.style.display = "none";
    controls.hidden = false;

    prepareFrame().catch(()=>{});
    note("カメラが起動しました");

  }catch(error){
    console.error(error);

    if(showHelpOnFail){
      if(isInAppBrowser()){
        openBrowserBtn.style.display = "block";
        permissionGuide.style.display = "block";
        permissionGuide.innerHTML =
          "<strong>アプリ内ブラウザではカメラが使えない場合があります。</strong><br>右上のメニューなどからSafari / Chromeで開いてください。";
        retryBtn.hidden = false;
      }else{
        showPermissionHelp();
      }
    }

    throw error;

  }finally{
    startBtn.disabled = false;
    retryBtn.disabled = false;
  }
}

async function switchCamera(){
  if(cameraDevices.length < 2){
    note("切り替え可能なカメラが見つかりません");
    return;
  }

  let index = cameraDevices.findIndex(d=>d.deviceId === currentDeviceId);
  index = (index + 1) % cameraDevices.length;
  const next = cameraDevices[index];

  try{
    stopCamera();
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{deviceId:{exact:next.deviceId}}
    });

    camera.srcObject = stream;
    await camera.play();
    currentDeviceId = next.deviceId;
    note("カメラを切り替えました");
  }catch(e){
    note("カメラ切替に失敗しました");
  }
}

function getCoverCrop(sw,sh,tw,th){
  const sr = sw/sh;
  const tr = tw/th;
  let sx=0,sy=0,cw=sw,ch=sh;

  if(sr > tr){
    cw = sh * tr;
    sx = (sw-cw)/2;
  }else{
    ch = sw/tr;
    sy = (sh-ch)/2;
  }

  return {sx,sy,cw,ch};
}

function canvasToBlob(canvas){
  return new Promise((resolve,reject)=>{
    canvas.toBlob(
      blob=>blob ? resolve(blob) : reject(new Error("画像作成エラー")),
      "image/png"
    );
  });
}

async function takePhoto(){
  if(!camera.videoWidth || !camera.videoHeight){
    note("カメラの準備中です");
    return;
  }

  if(!frameReady){
    await prepareFrame();
  }

  const outputWidth = 1086;
  const outputHeight = 1536;

  photoCanvas.width = outputWidth;
  photoCanvas.height = outputHeight;

  const ctx = photoCanvas.getContext("2d",{alpha:true});
  ctx.clearRect(0,0,outputWidth,outputHeight);

  const crop = getCoverCrop(
    camera.videoWidth,
    camera.videoHeight,
    outputWidth,
    outputHeight
  );

  ctx.drawImage(
    camera,
    crop.sx,crop.sy,crop.cw,crop.ch,
    0,0,outputWidth,outputHeight
  );

  ctx.drawImage(frameCanvas,0,0,outputWidth,outputHeight);

  capturedBlob = await canvasToBlob(photoCanvas);

  if(capturedUrl){
    URL.revokeObjectURL(capturedUrl);
  }

  capturedUrl = URL.createObjectURL(capturedBlob);
  previewImg.src = capturedUrl;
  preview.style.display = "flex";
}

function savePhoto(){
  if(!capturedUrl) return;

  const link = document.createElement("a");
  link.href = capturedUrl;
  link.download = "stellar-pet-marche-" + Date.now() + ".png";

  document.body.appendChild(link);
  link.click();
  link.remove();

  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2400);
}

function retakePhoto(){
  preview.style.display = "none";
  previewImg.removeAttribute("src");

  if(capturedUrl){
    URL.revokeObjectURL(capturedUrl);
  }

  capturedUrl = "";
  capturedBlob = null;
}

startBtn.addEventListener("click",()=>startCamera(true).catch(()=>{}));
retryBtn.addEventListener("click",()=>startCamera(true).catch(()=>{}));
switchBtn.addEventListener("click",switchCamera);
shootBtn.addEventListener("click",takePhoto);
saveBtn.addEventListener("click",savePhoto);
retakeBtn.addEventListener("click",retakePhoto);

openBrowserBtn.addEventListener("click",()=>{
  /* ブラウザを強制指定することはできないのでURLをコピーしやすくする */
  navigator.clipboard?.writeText(location.href).then(()=>{
    openBrowserBtn.textContent = "URLをコピーしました";
  }).catch(()=>{
    openBrowserBtn.textContent = "右上メニューからブラウザで開いてください";
  });
});

window.addEventListener("pagehide",stopCamera);

/*
  URLを直接開いた時も、自動でカメラ起動を試みます。
  ブラウザ仕様で自動起動できない場合は、ボタンを残します。
*/
window.addEventListener("load",async()=>{
  fitStage();
  prepareFrame().catch(()=>{});

  if(isInAppBrowser()){
    introText.innerHTML =
      "アプリ内ブラウザではカメラが起動しない場合があります。<br>必要に応じてSafari / Chromeで開いてください。";
    openBrowserBtn.style.display = "block";
    return;
  }

  if(!autoTried){
    autoTried = true;
    try{
      await startCamera(false);
    }catch(e){
      introText.innerHTML =
        "下のボタンを押して、表示される確認画面で<br>カメラを<strong>「許可」</strong>してください。";
    }
  }
});
</script>
</body>
</html>
