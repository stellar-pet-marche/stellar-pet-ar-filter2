<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07152f" />
  <title>ステラペットマルシェ｜ARフォトスポット</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family:
        -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Yu Gothic", Meiryo, sans-serif;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 2;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 4;
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 0 18px;
    }

    #controls[hidden] {
      display: none;
    }

    .controlButton {
      min-width: 118px;
      min-height: 52px;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 5px 18px rgba(0,0,0,.35);
    }

    #switchButton {
      background: #6d3da5;
      color: #fff;
    }

    #shootButton {
      background: #fff;
      color: #1d2230;
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(24px, env(safe-area-inset-top))
        22px
        max(24px, env(safe-area-inset-bottom));
      color: #fff;
      text-align: center;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,170,50,.20), transparent 35%),
        linear-gradient(160deg, #0d1d3b, #25112f 80%);
    }

    .panel {
      width: min(100%, 420px);
      padding: 30px 22px;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    .panel h1 {
      margin: 0 0 14px;
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.35;
    }

    .panel p {
      margin: 0 0 22px;
      font-size: 15px;
      line-height: 1.75;
    }

    #startButton,
    #retryButton {
      width: 100%;
      min-height: 54px;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 800;
    }

    #startButton {
      color: #fff;
      background: #f28c28;
      font-size: 17px;
    }

    #retryButton {
      margin-top: 12px;
      color: #23172c;
      background: #fff;
    }

    #permissionGuide {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(0,0,0,.28);
      text-align: left;
      font-size: 13px;
      line-height: 1.7;
    }

    #previewScreen {
      z-index: 20;
      display: none;
      flex-direction: column;
      background: rgba(0,0,0,.95);
    }

    #previewImage {
      max-width: 100%;
      max-height: calc(100% - 155px);
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
    }

    #previewActions {
      width: min(100%, 430px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    #saveButton,
    #retakeButton {
      min-height: 52px;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
    }

    #saveButton {
      color: #21170a;
      background: #ffc640;
    }

    #retakeButton {
      color: #222;
      background: #fff;
    }

    #messageBar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      max-width: 90%;
      padding: 8px 13px;
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,.58);
      font-size: 13px;
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
    }

    #messageBar.show {
      opacity: 1;
    }

    #saveToast {
      position: fixed;
      left: 50%;
      bottom: max(110px, calc(env(safe-area-inset-bottom) + 85px));
      z-index: 50;
      transform: translate(-50%, 18px);
      width: min(calc(100% - 34px), 380px);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 17px;
      border-radius: 18px;
      background: rgba(15,15,18,.94);
      color: #fff;
      box-shadow: 0 12px 32px rgba(0,0,0,.42);
      opacity: 0;
      visibility: hidden;
      transition: opacity .22s ease, transform .22s ease, visibility .22s;
    }

    #saveToast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    #saveToastIcon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #42c95a;
      color: #fff;
      font-size: 27px;
      font-weight: 900;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>
  <main id="app">
    <video id="camera" autoplay muted playsinline></video>

    <!-- GitHub上で index.html と同じ場所に frame.png を置いてください -->
    <img id="frame" src="frame.png" alt="ステラペットマルシェ ARフレーム" />

    <div id="messageBar"></div>

    <div id="controls" hidden>
      <button id="switchButton" class="controlButton" type="button">↻ カメラ切替</button>
      <button id="shootButton" class="controlButton" type="button">📷 撮影</button>
    </div>

    <section id="startScreen" class="screen">
      <div class="panel">
        <h1>🌟 ステラペットマルシェ<br>ARフォトスポット</h1>
        <p>
          「カメラを起動する」を押したあと、<br>
          ブラウザの確認画面でカメラの使用を<br>
          <strong>「許可」</strong>してください。
        </p>

        <button id="startButton" type="button">カメラを起動する</button>
        <button id="retryButton" type="button" hidden>設定変更後にもう一度試す</button>

        <div id="permissionGuide"></div>
      </div>
    </section>

    <section id="previewScreen" class="screen">
      <img id="previewImage" alt="撮影した写真" />

      <div id="previewActions">
        <button id="saveButton" type="button">写真を保存</button>
        <button id="retakeButton" type="button">撮り直す</button>
      </div>
    </section>

    <div id="saveToast" role="status" aria-live="polite">
      <div id="saveToastIcon">✓</div>
      <div>
        <strong>保存しました！</strong><br>
        <span style="font-size:12px;color:#b7f3c0;">端末の保存先をご確認ください</span>
      </div>
    </div>

    <canvas id="photoCanvas"></canvas>
  </main>

  <script>
    "use strict";

    const video = document.getElementById("camera");
    const frame = document.getElementById("frame");
    const controls = document.getElementById("controls");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const retryButton = document.getElementById("retryButton");
    const permissionGuide = document.getElementById("permissionGuide");
    const switchButton = document.getElementById("switchButton");
    const shootButton = document.getElementById("shootButton");
    const previewScreen = document.getElementById("previewScreen");
    const previewImage = document.getElementById("previewImage");
    const saveButton = document.getElementById("saveButton");
    const retakeButton = document.getElementById("retakeButton");
    const canvas = document.getElementById("photoCanvas");
    const messageBar = document.getElementById("messageBar");
    const saveToast = document.getElementById("saveToast");

    let stream = null;
    let facingMode = "environment";
    let capturedBlob = null;
    let capturedUrl = "";
    let isStarting = false;
    let toastTimer = null;

    function showMessage(text, duration = 2200) {
      messageBar.textContent = text;
      messageBar.classList.add("show");

      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => {
        messageBar.classList.remove("show");
      }, duration);
    }

    function showSaveToast() {
      clearTimeout(toastTimer);
      saveToast.classList.add("show");

      if (navigator.vibrate) {
        navigator.vibrate(45);
      }

      toastTimer = setTimeout(() => {
        saveToast.classList.remove("show");
      }, 2600);
    }

    function stopCamera() {
      if (!stream) return;

      stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
    }

    function setLoading(loading) {
      isStarting = loading;
      startButton.disabled = loading;
      retryButton.disabled = loading;

      startButton.textContent = loading
        ? "カメラを起動しています…"
        : "カメラを起動する";
    }

    function showPermissionDeniedGuide() {
      permissionGuide.style.display = "block";
      permissionGuide.innerHTML = `
        <strong>カメラがブロックされています</strong><br>
        ブラウザの設定から、このサイトのカメラを「許可」に変更してください。<br><br>

        <strong>iPhone・Safari</strong><br>
        アドレス欄の「ぁあ」→「Webサイトの設定」→「カメラ」→「許可」<br><br>

        <strong>Android・Chrome</strong><br>
        アドレス欄左の設定アイコン→「権限」→「カメラ」→「許可」
      `;

      startButton.hidden = true;
      retryButton.hidden = false;
    }

    async function openCamera() {
      if (isStarting) return;

      setLoading(true);
      permissionGuide.style.display = "none";

      try {
        if (!window.isSecureContext) {
          throw new Error("HTTPS_REQUIRED");
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("UNSUPPORTED");
        }

        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        startScreen.style.display = "none";
        controls.hidden = false;

        video.style.transform =
          facingMode === "user" ? "scaleX(-1)" : "none";

        showMessage("撮影ボタンで写真を撮れます");
      } catch (error) {
        console.error(error);

        if (
          error.name === "NotAllowedError" ||
          error.name === "PermissionDeniedError"
        ) {
          showPermissionDeniedGuide();
        } else {
          permissionGuide.style.display = "block";
          permissionGuide.textContent =
            "カメラを起動できませんでした。GitHub PagesのHTTPS公開URLからSafariまたはChromeで開いてください。";
        }
      } finally {
        setLoading(false);
      }
    }

    function getCoverCrop(sourceWidth, sourceHeight, targetWidth, targetHeight) {
      const sourceRatio = sourceWidth / sourceHeight;
      const targetRatio = targetWidth / targetHeight;

      let sx = 0;
      let sy = 0;
      let sw = sourceWidth;
      let sh = sourceHeight;

      if (sourceRatio > targetRatio) {
        sw = sourceHeight * targetRatio;
        sx = (sourceWidth - sw) / 2;
      } else {
        sh = sourceWidth / targetRatio;
        sy = (sourceHeight - sh) / 2;
      }

      return { sx, sy, sw, sh };
    }

    function canvasToBlob(canvasElement) {
      return new Promise((resolve, reject) => {
        canvasElement.toBlob(blob => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("画像を作成できませんでした"));
          }
        }, "image/jpeg", 0.95);
      });
    }

    async function takePhoto() {
      if (!video.videoWidth || !video.videoHeight) {
        showMessage("カメラの準備ができていません");
        return;
      }

      if (!frame.complete || frame.naturalWidth === 0) {
        showMessage("frame.pngを読み込めませんでした");
        return;
      }

      const outputWidth = 1080;
      const outputHeight = 1920;
      const context = canvas.getContext("2d");

      canvas.width = outputWidth;
      canvas.height = outputHeight;
      context.clearRect(0, 0, outputWidth, outputHeight);

      const crop = getCoverCrop(
        video.videoWidth,
        video.videoHeight,
        outputWidth,
        outputHeight
      );

      if (facingMode === "user") {
        context.save();
        context.translate(outputWidth, 0);
        context.scale(-1, 1);

        context.drawImage(
          video,
          crop.sx,
          crop.sy,
          crop.sw,
          crop.sh,
          0,
          0,
          outputWidth,
          outputHeight
        );

        context.restore();
      } else {
        context.drawImage(
          video,
          crop.sx,
          crop.sy,
          crop.sw,
          crop.sh,
          0,
          0,
          outputWidth,
          outputHeight
        );
      }

      context.drawImage(
        frame,
        0,
        0,
        outputWidth,
        outputHeight
      );

      try {
        capturedBlob = await canvasToBlob(canvas);

        if (capturedUrl) {
          URL.revokeObjectURL(capturedUrl);
        }

        capturedUrl = URL.createObjectURL(capturedBlob);
        previewImage.src = capturedUrl;
        previewScreen.style.display = "flex";
      } catch (error) {
        console.error(error);
        showMessage("写真の作成に失敗しました");
      }
    }

    function getFileName() {
      const now = new Date();

      const stamp =
        now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        "-" +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0") +
        String(now.getSeconds()).padStart(2, "0");

      return `stellar-pet-marche-${stamp}.jpg`;
    }

    function savePhoto() {
      if (!capturedBlob || !capturedUrl) return;

      const link = document.createElement("a");
      link.href = capturedUrl;
      link.download = getFileName();
      link.style.display = "none";

      document.body.appendChild(link);
      link.click();
      link.remove();

      showSaveToast();
    }

    function retakePhoto() {
      previewScreen.style.display = "none";
      previewImage.removeAttribute("src");

      if (capturedUrl) {
        URL.revokeObjectURL(capturedUrl);
      }

      capturedUrl = "";
      capturedBlob = null;
    }

    startButton.addEventListener("click", openCamera);
    retryButton.addEventListener("click", openCamera);

    switchButton.addEventListener("click", async () => {
      facingMode =
        facingMode === "environment" ? "user" : "environment";

      await openCamera();
    });

    shootButton.addEventListener("click", takePhoto);
    saveButton.addEventListener("click", savePhoto);
    retakeButton.addEventListener("click", retakePhoto);

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
