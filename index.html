<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ステラペットマルシェ ARフォトスポット</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif}
button{border:0;font:inherit;cursor:pointer}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000}
#frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:2;pointer-events:none}
#controls{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;gap:12px}
#controls[hidden]{display:none}
.btn{min-width:120px;min-height:50px;padding:12px 18px;border-radius:999px;font-size:15px;font-weight:800;box-shadow:0 5px 18px rgba(0,0,0,.4)}
#switchBtn{background:#7b4bb5;color:#fff}
#shootBtn{background:#fff;color:#222}
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;color:#fff;text-align:center;background:linear-gradient(160deg,#3d3740,#1d1920)}
.card{width:min(100%,430px);padding:28px 20px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.card h1{margin:0;font-size:28px;white-space:nowrap}
.card h2{margin:6px 0 18px;font-size:30px;color:#d98cff;white-space:nowrap}
.card p{line-height:1.75}
#startBtn,#retryBtn{width:100%;min-height:54px;border-radius:999px;padding:14px 20px;font-weight:800}
#startBtn{background:#8c4bc2;color:#fff}
#retryBtn{margin-top:12px;background:#fff;color:#24142d}
#help{display:none;margin-top:16px;padding:14px;border-radius:14px;background:rgba(0,0,0,.3);text-align:left;font-size:13px;line-height:1.7}
#preview{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.96);padding:16px}
#previewImg{max-width:100%;max-height:78vh;object-fit:contain}
#previewBtns{display:flex;gap:10px;margin-top:14px}
#saveBtn,#retakeBtn{min-height:50px;border-radius:999px;padding:12px 18px;font-weight:800}
#saveBtn{background:#ffd43b}
#retakeBtn{background:#fff}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;background:#111;color:#fff;padding:16px 20px;border-radius:18px;display:none}
canvas{display:none}
</style>
</head>
<body>
<main id="app">
<div id="stage">
  <video id="camera" autoplay muted playsinline></video>
  <img id="frame" src="frame_transparent.png?v=final1" alt="">
</div>

<div id="controls" hidden>
  <button id="switchBtn" class="btn">↻ カメラ切替</button>
  <button id="shootBtn" class="btn">📷 撮影</button>
</div>

<section id="gate" class="screen">
  <div class="card">
    <h1>ステラペットマルシェ</h1>
    <h2>ARフォトスポット</h2>
    <p>「カメラを起動する」を押して、<br>表示される確認画面でカメラを<br><strong>「許可」</strong>してください。</p>
    <button id="startBtn">カメラを起動する</button>
    <button id="retryBtn" hidden>もう一度カメラを起動する</button>
    <div id="help"></div>
  </div>
</section>

<section id="preview">
  <img id="previewImg" alt="撮影した写真">
  <div id="previewBtns">
    <button id="saveBtn">写真を保存</button>
    <button id="retakeBtn">撮り直す</button>
  </div>
</section>

<div id="toast">✓ 保存しました！</div>
<canvas id="canvas"></canvas>
</main>

<script>
const camera=document.getElementById("camera");
const frame=document.getElementById("frame");
const gate=document.getElementById("gate");
const startBtn=document.getElementById("startBtn");
const retryBtn=document.getElementById("retryBtn");
const help=document.getElementById("help");
const controls=document.getElementById("controls");
const switchBtn=document.getElementById("switchBtn");
const shootBtn=document.getElementById("shootBtn");
const preview=document.getElementById("preview");
const previewImg=document.getElementById("previewImg");
const saveBtn=document.getElementById("saveBtn");
const retakeBtn=document.getElementById("retakeBtn");
const toast=document.getElementById("toast");
const canvas=document.getElementById("canvas");
const stage=document.getElementById("stage");

let stream=null;
let devices=[];
let currentDeviceId=null;
let capturedUrl="";

function fitStage(){
  if(!frame.naturalWidth||!frame.naturalHeight)return;
  const ir=frame.naturalWidth/frame.naturalHeight;
  const vw=innerWidth,vh=innerHeight,vr=vw/vh;
  let w,h;
  if(vr>ir){h=vh;w=h*ir}else{w=vw;h=w/ir}
  stage.style.width=w+"px";
  stage.style.height=h+"px";
}
frame.addEventListener("load",fitStage);
addEventListener("resize",fitStage);

function stopStream(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;camera.srcObject=null}
}

function showHelp(){
  help.style.display="block";
  help.innerHTML='<strong>カメラを起動できませんでした。</strong><br><br>iPhone / Safari：アドレス欄の「ぁあ」→「Webサイトの設定」→「カメラ」→「許可」<br><br>Android / Chrome：アドレス欄左の設定アイコン→「権限」→「カメラ」→「許可」';
  startBtn.hidden=true;
  retryBtn.hidden=false;
}

async function openCamera(){
  help.style.display="none";
  try{
    if(!window.isSecureContext)throw new Error("HTTPS");
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("NO_CAMERA");
    stopStream();
    stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    camera.srcObject=stream;
    await camera.play();
    const track=stream.getVideoTracks()[0];
    currentDeviceId=track.getSettings().deviceId||null;
    const all=await navigator.mediaDevices.enumerateDevices();
    devices=all.filter(d=>d.kind==="videoinput");
    gate.style.display="none";
    controls.hidden=false;
  }catch(e){
    console.error(e);
    showHelp();
  }
}

async function switchCamera(){
  if(devices.length<2)return;
  let i=devices.findIndex(d=>d.deviceId===currentDeviceId);
  i=(i+1)%devices.length;
  const next=devices[i];
  try{
    stopStream();
    stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:next.deviceId}},audio:false});
    camera.srcObject=stream;
    await camera.play();
    currentDeviceId=next.deviceId;
  }catch(e){console.error(e)}
}

function crop(sw,sh,tw,th){
  const sr=sw/sh,tr=tw/th;
  let sx=0,sy=0,cw=sw,ch=sh;
  if(sr>tr){cw=sh*tr;sx=(sw-cw)/2}else{ch=sw/tr;sy=(sh-ch)/2}
  return {sx,sy,cw,ch};
}

async function takePhoto(){
  if(!camera.videoWidth||!frame.complete)return;
  const w=frame.naturalWidth,h=frame.naturalHeight;
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d");
  const c=crop(camera.videoWidth,camera.videoHeight,w,h);
  ctx.drawImage(camera,c.sx,c.sy,c.cw,c.ch,0,0,w,h);
  ctx.drawImage(frame,0,0,w,h);
  const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
  if(capturedUrl)URL.revokeObjectURL(capturedUrl);
  capturedUrl=URL.createObjectURL(blob);
  previewImg.src=capturedUrl;
  preview.style.display="flex";
}

function savePhoto(){
  if(!capturedUrl)return;
  const a=document.createElement("a");
  a.href=capturedUrl;
  a.download="stellar-pet-marche-"+Date.now()+".png";
  document.body.appendChild(a);a.click();a.remove();
  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",2200);
}

function retake(){
  preview.style.display="none";
}

startBtn.onclick=openCamera;
retryBtn.onclick=openCamera;
switchBtn.onclick=switchCamera;
shootBtn.onclick=takePhoto;
saveBtn.onclick=savePhoto;
retakeBtn.onclick=retake;
addEventListener("pagehide",stopStream);
</script>
</body>
</html>
