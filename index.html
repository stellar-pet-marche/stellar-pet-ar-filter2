<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ステラペットマルシェ ARフォトスポット</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif}
button{border:0;font:inherit;cursor:pointer}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
#frameCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#controls{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;gap:12px}
#controls[hidden]{display:none}
.btn{min-width:120px;min-height:50px;padding:12px 18px;border-radius:999px;font-size:15px;font-weight:800;box-shadow:0 5px 18px #0006}
#switchBtn{background:#7a45b7;color:#fff}#shootBtn{background:#fff;color:#222}
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;color:#fff;text-align:center;background:linear-gradient(160deg,#241530,#100d19)}
.card{width:min(100%,430px);padding:28px 20px;border-radius:24px;background:#ffffff14;border:1px solid #ffffff2a}
.t1,.t2{display:block;white-space:nowrap;font-weight:900;line-height:1.2}.t1{font-size:clamp(22px,5.7vw,31px)}.t2{margin-top:6px;font-size:clamp(25px,6.4vw,34px);color:#d98cff}
.card p{margin:18px 0 22px;font-size:15px;line-height:1.75}
#startBtn,#retryBtn{width:100%;min-height:54px;padding:14px 20px;border-radius:999px;font-weight:800}
#startBtn{background:#8c4bc2;color:#fff}#retryBtn{margin-top:12px;background:#fff;color:#24142d}
#permissionGuide{display:none;margin-top:18px;padding:15px;border-radius:16px;background:#0005;text-align:left;font-size:13px;line-height:1.7}
#preview{z-index:30;display:none;flex-direction:column;background:#000f}
#previewImg{max-width:100%;max-height:calc(100dvh - 150px);object-fit:contain;border-radius:12px}
#previewBtns{width:min(100%,430px);display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
#saveBtn,#retakeBtn{min-height:50px;padding:12px 14px;border-radius:999px;font-weight:800}
#saveBtn{background:#ffd43b}#retakeBtn{background:#fff}
#toast{position:fixed;left:50%;top:50%;z-index:60;transform:translate(-50%,-45%);width:min(calc(100% - 34px),360px);padding:18px 20px;border-radius:20px;background:#111f;color:#fff;opacity:0;visibility:hidden;transition:.22s}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
#message{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;padding:8px 13px;border-radius:999px;color:#fff;background:#0009;font-size:13px;opacity:0;transition:.25s}
#message.show{opacity:1}
canvas.hidden{display:none}
</style>
</head>
<body>
<main id="app">
<div id="stage">
<video id="camera" autoplay muted playsinline></video>
<canvas id="frameCanvas"></canvas>
</div>
<div id="message"></div>
<div id="controls" hidden>
<button id="switchBtn" class="btn">↻ カメラ切替</button>
<button id="shootBtn" class="btn">📷 撮影</button>
</div>
<section id="startScreen" class="screen">
<div class="card">
<span class="t1">ステラペットマルシェ</span>
<span class="t2">ARフォトスポット</span>
<p>「カメラを起動する」を押したあと、<br>ブラウザの確認画面でカメラの使用を<br><strong>「許可」</strong>してください。</p>
<button id="startBtn">カメラを起動する</button>
<button id="retryBtn" hidden>もう一度カメラを起動する</button>
<div id="permissionGuide"></div>
</div>
</section>
<section id="preview" class="screen">
<img id="previewImg" alt="撮影した写真">
<div id="previewBtns">
<button id="saveBtn">写真を保存</button>
<button id="retakeBtn">撮り直す</button>
</div>
</section>
<div id="toast">✓ 保存しました！</div>
<canvas id="photoCanvas" class="hidden"></canvas>
</main>
<script>
const FRAME_URL="frame.png?v=ghost01";
const stage=document.getElementById("stage"),camera=document.getElementById("camera"),frameCanvas=document.getElementById("frameCanvas"),controls=document.getElementById("controls"),startScreen=document.getElementById("startScreen"),startBtn=document.getElementById("startBtn"),retryBtn=document.getElementById("retryBtn"),permissionGuide=document.getElementById("permissionGuide"),switchBtn=document.getElementById("switchBtn"),shootBtn=document.getElementById("shootBtn"),preview=document.getElementById("preview"),previewImg=document.getElementById("previewImg"),saveBtn=document.getElementById("saveBtn"),retakeBtn=document.getElementById("retakeBtn"),photoCanvas=document.getElementById("photoCanvas"),toast=document.getElementById("toast"),message=document.getElementById("message");
let stream=null,facingMode="environment",frameW=0,frameH=0,capturedUrl="",capturedBlob=null;

function note(t,ms=2200){message.textContent=t;message.classList.add("show");setTimeout(()=>message.classList.remove("show"),ms)}
function fitStage(){if(!frameW||!frameH)return;const ir=frameW/frameH,vw=innerWidth,vh=innerHeight,vr=vw/vh;let w,h;if(vr>ir){h=vh;w=h*ir}else{w=vw;h=w/ir}stage.style.width=w+"px";stage.style.height=h+"px"}
addEventListener("resize",fitStage);
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;camera.srcObject=null}}
function permissionHelp(){permissionGuide.style.display="block";permissionGuide.innerHTML='<strong>カメラを起動できませんでした</strong><br><br>SafariまたはChromeでこのページを開き、このサイトのカメラを「許可」にしてください。';startBtn.hidden=true;retryBtn.hidden=false}

async function prepareFrame(){
 const img=new Image();img.src=FRAME_URL;
 await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});
 frameW=img.naturalWidth;frameH=img.naturalHeight;
 frameCanvas.width=frameW;frameCanvas.height=frameH;
 const ctx=frameCanvas.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(img,0,0);
 const image=ctx.getImageData(0,0,frameW,frameH),d=image.data,total=frameW*frameH;
 const visited=new Uint8Array(total),queue=new Int32Array(total);
 let head=0,tail=0;
 const seedX=Math.floor(frameW*.5),seedY=Math.floor(frameH*.48),seed=seedY*frameW+seedX;
 queue[tail++]=seed;visited[seed]=1;
 function isDark(i){const p=i*4;return d[p]<85&&d[p+1]<85&&d[p+2]<85}
 while(head<tail){
   const i=queue[head++];if(!isDark(i))continue;d[i*4+3]=0;
   const x=i%frameW,y=(i/frameW)|0;
   if(x>0){let n=i-1;if(!visited[n]){visited[n]=1;queue[tail++]=n}}
   if(x<frameW-1){let n=i+1;if(!visited[n]){visited[n]=1;queue[tail++]=n}}
   if(y>0){let n=i-frameW;if(!visited[n]){visited[n]=1;queue[tail++]=n}}
   if(y<frameH-1){let n=i+frameW;if(!visited[n]){visited[n]=1;queue[tail++]=n}}
 }
 ctx.putImageData(image,0,0);fitStage();
}

async function openCamera(){
 permissionGuide.style.display="none";
 try{
   if(!window.isSecureContext)throw new Error("HTTPS");
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("NO_MEDIA");
   stopCamera();
   stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facingMode}}});
   camera.srcObject=stream;await camera.play();
   camera.style.transform=facingMode==="user"?"scaleX(-1)":"none";
   startScreen.style.display="none";controls.hidden=false;note("カメラが起動しました");
 }catch(e){console.error(e);permissionHelp()}
}

function crop(sw,sh,tw,th){const sr=sw/sh,tr=tw/th;let sx=0,sy=0,cw=sw,ch=sh;if(sr>tr){cw=sh*tr;sx=(sw-cw)/2}else{ch=sw/tr;sy=(sh-ch)/2}return{sx,sy,cw,ch}}
function toBlob(c){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error()),"image/png"))}

async function takePhoto(){
 if(!camera.videoWidth||!frameW){note("準備中です");return}
 const w=1440,h=Math.round(w*(frameH/frameW));photoCanvas.width=w;photoCanvas.height=h;
 const ctx=photoCanvas.getContext("2d",{alpha:true});ctx.clearRect(0,0,w,h);
 const c=crop(camera.videoWidth,camera.videoHeight,w,h);
 if(facingMode==="user"){ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(camera,c.sx,c.sy,c.cw,c.ch,0,0,w,h);ctx.restore()}
 else ctx.drawImage(camera,c.sx,c.sy,c.cw,c.ch,0,0,w,h);
 ctx.drawImage(frameCanvas,0,0,w,h);
 capturedBlob=await toBlob(photoCanvas);
 if(capturedUrl)URL.revokeObjectURL(capturedUrl);
 capturedUrl=URL.createObjectURL(capturedBlob);previewImg.src=capturedUrl;preview.style.display="flex";
}

function savePhoto(){
 if(!capturedUrl)return;
 const a=document.createElement("a");a.href=capturedUrl;a.download="stellar-pet-marche-"+Date.now()+".png";
 document.body.appendChild(a);a.click();a.remove();
 toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2400);
}
function retake(){preview.style.display="none";if(capturedUrl)URL.revokeObjectURL(capturedUrl);capturedUrl="";capturedBlob=null}

startBtn.onclick=openCamera;retryBtn.onclick=openCamera;switchBtn.onclick=async()=>{facingMode=facingMode==="environment"?"user":"environment";await openCamera()};shootBtn.onclick=takePhoto;saveBtn.onclick=savePhoto;retakeBtn.onclick=retake;addEventListener("pagehide",stopCamera);
addEventListener("load",()=>prepareFrame().catch(e=>{console.error(e);note("frame.pngを確認してください",4000)}));
</script>
</body>
</html>
