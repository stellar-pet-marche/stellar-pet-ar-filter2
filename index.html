<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07152f">
  <title>ステラペットマルシェ ARフォトスポット</title>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Yu Gothic", Meiryo, sans-serif;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    #app {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    /* フレーム画像とカメラを同じ比率の中に入れる */
    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #camera,
    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #camera {
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    #frame {
      object-fit: fill;
      z-index: 2;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 14px;
    }

    #controls[hidden] { display: none; }

    .controlBtn {
      min-width: 122px;
      min-height: 50px;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 18px rgba(0,0,0,.4);
    }

    #switchBtn { background: #6d3da5; color: #fff; }
    #shootBtn { background: #fff; color: #1d2230; }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(22px, env(safe-area-inset-top))
        18px
        max(22px, env(safe-area-inset-bottom));
      color: #fff;
      text-align: center;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,170,50,.18), transparent 34%),
        linear-gradient(160deg, #0b1b3b, #23112f 82%);
    }

    .card {
      width: min(100%, 430px);
      padding: 28px 20px;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    /* 自動改行ではなく、意図した2行に固定 */
    .titleLine1,
    .titleLine2 {
      display: block;
      white-space: nowrap;
    }

    .titleLine1 {
      font-size: clamp(23px, 6vw, 31px);
      line-height: 1.2;
      font-weight: 900;
    }

    .titleLine2 {
      margin-top: 6px;
      font-size: clamp(25px, 6.5vw, 34px);
      line-height: 1.2;
      font-weight: 900;
      color: #ffd36a;
    }

    .card p {
      margin: 18px 0 22px;
      font-size: 15px;
      line-height: 1.75;
    }

    #startBtn,
    #retryBtn {
      width: 100%;
      min-height: 54px;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 800;
    }

    #startBtn {
      background: #f28c28;
      color: #fff;
      font-size: 17px;
    }

    #retryBtn {
      margin-top: 12px;
      background: #fff;
      color: #24142d;
    }

    #permissionGuide {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 16px;
      background: rgba(0,0,0,.28);
      text-align: left;
      font-size: 13px;
      line-height: 1.7;
    }

    #preview {
      z-index: 30;
      display: none;
      flex-direction: column;
      background: rgba(0,0,0,.96);
    }

    #previewImg {
      max-width: 100%;
      max-height: calc(100dvh - 150px);
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
    }

    #previewBtns {
      width: min(100%, 430px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    #saveBtn,
    #retakeBtn {
      min-height: 50px;
      padding: 12px 14px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
    }

    #saveBtn { background: #ffc640; color: #21170a; }
    #retakeBtn { background: #fff; color: #222; }

    #message {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 7;
      max-width: 90%;
      padding: 8px 13px;
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,.62);
      font-size: 13px;
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
    }

    #message.show { opacity: 1; }

    #toast {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 60;
      transform: translate(-50%, -45%);
      width: min(calc(100% - 34px), 360px);
      padding: 18px 20px;
      border-radius: 20px;
      background: rgba(15,15,18,.97);
      color: #fff;
      box-shadow: 0 16px 40px rgba(0,0,0,.5);
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transition: .22s ease;
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%);
    }

    #toastIcon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      background: #42c95a;
      display: grid;
      place-items: center;
      font-size: 27px;
      font-weight: 900;
    }

    canvas { display: none; }
  </style>
</head>

<body>
<main id="app">

  <div id="stage">
    <video id="camera" autoplay muted playsinline></video>
    <!-- キャッシュ対策の ?v=3 を付けています -->
    <img id="frame" src="frame.png?v=3" alt="ステラペットマルシェ ARフレーム">
  </div>

  <div id="message"></div>

  <div id="controls" hidden>
    <button id="switchBtn" class="controlBtn" type="button">↻ カメラ切替</button>
    <button id="shootBtn" class="controlBtn" type="button">📷 撮影</button>
  </div>

  <section id="startScreen" class="screen">
    <div class="card">
      <div class="titleLine1">ステラペットマルシェ</div>
      <div class="titleLine2">ARフォトスポット</div>

      <p>
        「カメラを起動する」を押したあと、<br>
        ブラウザの確認画面でカメラの使用を<br>
        <strong>「許可」</strong>してください。
      </p>

      <button id="startBtn" type="button">カメラを起動する</button>
      <button id="retryBtn" type="button" hidden>設定変更後にもう一度試す</button>

      <div id="permissionGuide"></div>
    </div>
  </section>

  <section id="preview" class="screen">
    <img id="previewImg" alt="撮影した写真">

    <div id="previewBtns">
      <button id="saveBtn" type="button">写真を保存</button>
      <button id="retakeBtn" type="button">撮り直す</button>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite">
    <div id="toastIcon">✓</div>
    <div>
      <strong>保存処理を開始しました！</strong><br>
      <span style="font-size:12px;color:#b7f3c0;">端末の保存先をご確認ください</span>
    </div>
  </div>

  <canvas id="canvas"></canvas>
</main>

<script>
"use strict";

const stage = document.getElementById("stage");
const camera = document.getElementById("camera");
const frame = document.getElementById("frame");
const controls = document.getElementById("controls");
const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");
const retryBtn = document.getElementById("retryBtn");
const permissionGuide = document.getElementById("permissionGuide");
const switchBtn = document.getElementById("switchBtn");
const shootBtn = document.getElementById("shootBtn");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const saveBtn = document.getElementById("saveBtn");
const retakeBtn = document.getElementById("retakeBtn");
const canvas = document.getElementById("canvas");
const toast = document.getElementById("toast");
const message = document.getElementById("message");

let stream = null;
let facingMode = "environment";
let capturedBlob = null;
let capturedUrl = "";
let starting = false;
let toastTimer = null;

/* 端末画面の中に、フレーム画像そのものの比率で全体表示 */
function fitStageToFrame() {
  if (!frame.naturalWidth || !frame.naturalHeight) return;

  const frameRatio = frame.naturalWidth / frame.naturalHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const viewportRatio = vw / vh;

  let width, height;

  if (viewportRatio > frameRatio) {
    height = vh;
    width = height * frameRatio;
  } else {
    width = vw;
    height = width / frameRatio;
  }

  stage.style.width = width + "px";
  stage.style.height = height + "px";
}

frame.addEventListener("load", fitStageToFrame);
window.addEventListener("resize", fitStageToFrame);

function showMessage(text, ms = 2200) {
  message.textContent = text;
  message.classList.add("show");
  clearTimeout(showMessage.timer);
  showMessage.timer = setTimeout(() => message.classList.remove("show"), ms);
}

function showToast() {
  clearTimeout(toastTimer);
  toast.classList.add("show");
  if (navigator.vibrate) navigator.vibrate(45);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
}

function stopCamera() {
  if (!stream) return;
  stream.getTracks().forEach(track => track.stop());
  stream = null;
  camera.srcObject = null;
}

function showPermissionGuide() {
  permissionGuide.style.display = "block";
  permissionGuide.innerHTML = `
    <strong>カメラがブロックされています</strong><br>
    ブラウザ設定からこのサイトのカメラを「許可」に変更してください。<br><br>
    <strong>iPhone・Safari</strong><br>
    アドレス欄の「ぁあ」→「Webサイトの設定」→「カメラ」→「許可」<br><br>
    <strong>Android・Chrome</strong><br>
    アドレス欄左の設定アイコン→「権限」→「カメラ」→「許可」
  `;
  startBtn.hidden = true;
  retryBtn.hidden = false;
}

async function openCamera() {
  if (starting) return;
  starting = true;
  permissionGuide.style.display = "none";

  try {
    if (!window.isSecureContext) throw new Error("HTTPS_REQUIRED");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("UNSUPPORTED");
    }

    stopCamera();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    camera.srcObject = stream;
    await camera.play();

    camera.style.transform =
      facingMode === "user" ? "scaleX(-1)" : "none";

    fitStageToFrame();

    startScreen.style.display = "none";
    controls.hidden = false;
    showMessage("撮影ボタンで写真を撮れます");

  } catch (e) {
    console.error(e);

    if (e.name === "NotAllowedError" || e.name === "PermissionDeniedError") {
      showPermissionGuide();
    } else {
      permissionGuide.style.display = "block";
      permissionGuide.textContent =
        "カメラを起動できませんでした。GitHub PagesのHTTPS公開URLからSafariまたはChromeで開いてください。";
    }
  } finally {
    starting = false;
  }
}

/* camera object-fit: cover と同じ切り抜きをCanvasでも再現 */
function getCoverCrop(sw, sh, tw, th) {
  const sr = sw / sh;
  const tr = tw / th;

  let sx = 0;
  let sy = 0;
  let cw = sw;
  let ch = sh;

  if (sr > tr) {
    cw = sh * tr;
    sx = (sw - cw) / 2;
  } else {
    ch = sw / tr;
    sy = (sh - ch) / 2;
  }

  return { sx, sy, cw, ch };
}

function canvasToBlob(canvasElement) {
  return new Promise((resolve, reject) => {
    canvasElement.toBlob(
      blob => blob ? resolve(blob) : reject(new Error("画像作成エラー")),
      "image/jpeg",
      0.95
    );
  });
}

async function takePhoto() {
  if (!camera.videoWidth || !camera.videoHeight) {
    showMessage("カメラの準備ができていません");
    return;
  }

  if (!frame.complete || !frame.naturalWidth || !frame.naturalHeight) {
    showMessage("frame.pngを読み込めませんでした");
    return;
  }

  /*
    ★重要★
    保存画像を1080×1920固定にせず、
    frame.pngそのものの縦横比で作るので、
    フレーム上部・下部が切れません。
  */
  const outputWidth = 1440;
  const outputHeight = Math.round(
    outputWidth * (frame.naturalHeight / frame.naturalWidth)
  );

  canvas.width = outputWidth;
  canvas.height = outputHeight;

  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, outputWidth, outputHeight);

  const crop = getCoverCrop(
    camera.videoWidth,
    camera.videoHeight,
    outputWidth,
    outputHeight
  );

  if (facingMode === "user") {
    ctx.save();
    ctx.translate(outputWidth, 0);
    ctx.scale(-1, 1);

    ctx.drawImage(
      camera,
      crop.sx,
      crop.sy,
      crop.cw,
      crop.ch,
      0,
      0,
      outputWidth,
      outputHeight
    );

    ctx.restore();
  } else {
    ctx.drawImage(
      camera,
      crop.sx,
      crop.sy,
      crop.cw,
      crop.ch,
      0,
      0,
      outputWidth,
      outputHeight
    );
  }

  /* frame.pngは1枚まるごと、そのまま全体を重ねる */
  ctx.drawImage(frame, 0, 0, outputWidth, outputHeight);

  capturedBlob = await canvasToBlob(canvas);

  if (capturedUrl) URL.revokeObjectURL(capturedUrl);
  capturedUrl = URL.createObjectURL(capturedBlob);

  previewImg.src = capturedUrl;
  preview.style.display = "flex";
}

function getFileName() {
  const now = new Date();

  return (
    "stellar-pet-marche-" +
    now.getFullYear() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") +
    "-" +
    String(now.getHours()).padStart(2, "0") +
    String(now.getMinutes()).padStart(2, "0") +
    String(now.getSeconds()).padStart(2, "0") +
    ".jpg"
  );
}

function savePhoto() {
  if (!capturedUrl) return;

  const a = document.createElement("a");
  a.href = capturedUrl;
  a.download = getFileName();
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();

  saveBtn.textContent = "✓ 保存しました";
  saveBtn.style.background = "#46c463";
  saveBtn.style.color = "#fff";
  saveBtn.disabled = true;

  showToast();

  setTimeout(() => {
    saveBtn.textContent = "写真を保存";
    saveBtn.style.background = "";
    saveBtn.style.color = "";
    saveBtn.disabled = false;
  }, 2200);
}

function retakePhoto() {
  preview.style.display = "none";
  previewImg.removeAttribute("src");

  if (capturedUrl) URL.revokeObjectURL(capturedUrl);
  capturedUrl = "";
  capturedBlob = null;
}

startBtn.addEventListener("click", openCamera);
retryBtn.addEventListener("click", openCamera);

switchBtn.addEventListener("click", async () => {
  facingMode =
    facingMode === "environment" ? "user" : "environment";
  await openCamera();
});

shootBtn.addEventListener("click", takePhoto);
saveBtn.addEventListener("click", savePhoto);
retakeBtn.addEventListener("click", retakePhoto);

window.addEventListener("pagehide", stopCamera);

if (frame.complete) fitStageToFrame();
</script>
</body>
</html>
